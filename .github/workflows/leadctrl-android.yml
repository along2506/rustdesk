name: Build LeadCtrl Android host

on:
  workflow_dispatch:
  push:
    branches:
      - leadctrl-client
    paths:
      - '.github/workflows/leadctrl-android.yml'
      - 'res/customize_leadctrl.py'
      - 'flutter/android/**'
      - 'flutter/lib/mobile/**'
      - 'src/**'
      - 'libs/base/**'

permissions:
  contents: write

env:
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: '3.1.2'
  ANDROID_FLUTTER_VERSION: '3.24.5'
  NDK_VERSION: 'r28c'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  VERSION: '1.5.0'
  TAG_NAME: 'leadctrl-android-r1'
  ANDROID_SIGNING_KEY: '${{ secrets.ANDROID_SIGNING_KEY }}'

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android-arm64:
    name: Build LeadCtrl Android ARM64 host
    needs: generate-bridge
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply LeadCtrl Android host configuration
        env:
          LEADCTRL_SERVER: '${{ secrets.LEADCTRL_SERVER }}'
          LEADCTRL_PUBLIC_KEY: '${{ secrets.LEADCTRL_PUBLIC_KEY }}'
          LEADCTRL_UNATTENDED_PASSWORD: '${{ secrets.LEADCTRL_UNATTENDED_PASSWORD }}'
        run: python3 res/customize_leadctrl.py --edition android

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            git \
            g++ \
            g++-multilib \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '${{ env.ANDROID_FLUTTER_VERSION }}'

      - name: Patch Flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: '${{ env.NDK_VERSION }}'
          add-to-path: true

      - name: Setup vcpkg cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'
          doNotCache: false

      - name: Build Android native dependencies
        run: ./flutter/build_android_deps.sh arm64-v8a

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '${{ env.RUST_VERSION }}'
          targets: aarch64-linux-android
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: leadctrl-android-arm64
          key: aarch64-linux-android

      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: '${{ steps.setup-ndk.outputs.ndk-path }}'
          ANDROID_NDK_ROOT: '${{ steps.setup-ndk.outputs.ndk-path }}'
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build installable APK
        env:
          ANDROID_NDK_HOME: '${{ steps.setup-ndk.outputs.ndk-path }}'
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' ./flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
            ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p signed-apk
          mv flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            signed-apk/leadctrl-${{ env.VERSION }}-android-arm64-unattended.apk

      - name: Select Android build tools
        if: ${{ env.ANDROID_SIGNING_KEY != '' }}
        run: echo "ANDROID_SIGN_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - name: Sign APK with the configured release key
        if: ${{ env.ANDROID_SIGNING_KEY != '' }}
        id: sign-apk
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: '${{ secrets.ANDROID_SIGNING_KEY }}'
          alias: '${{ secrets.ANDROID_ALIAS }}'
          keyStorePassword: '${{ secrets.ANDROID_KEY_STORE_PASSWORD }}'
          keyPassword: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        env:
          BUILD_TOOLS_VERSION: '${{ env.ANDROID_SIGN_TOOL_VERSION }}'

      - name: Upload signed APK artifact
        if: ${{ env.ANDROID_SIGNING_KEY != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadctrl-android-arm64-unattended
          path: '${{ steps.sign-apk.outputs.signedReleaseFile }}'

      - name: Upload debug-signed APK artifact
        if: ${{ env.ANDROID_SIGNING_KEY == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadctrl-android-arm64-unattended
          path: signed-apk/leadctrl-${{ env.VERSION }}-android-arm64-unattended.apk

      - name: Publish signed APK
        if: ${{ env.ANDROID_SIGNING_KEY != '' }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: '${{ env.TAG_NAME }}'
          files: '${{ steps.sign-apk.outputs.signedReleaseFile }}'

      - name: Publish debug-signed APK
        if: ${{ env.ANDROID_SIGNING_KEY == '' }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: '${{ env.TAG_NAME }}'
          files: signed-apk/leadctrl-${{ env.VERSION }}-android-arm64-unattended.apk
